services:
  flagd-ugc-pipeline:
    build: .
    restart: unless-stopped
    init: true
    command: ["flagd-ugc", "daemon"]
    environment:
      DATA_DIR: /data
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TIMEZONE: ${TIMEZONE:-America/Los_Angeles}
      RUN_TIME: ${RUN_TIME:-08:00}
      TZ: ${TIMEZONE:-America/Los_Angeles}
    volumes:
      - flagd-ugc-data:/data
    healthcheck:
      test: ["CMD", "flagd-ugc", "healthcheck"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  flagd-ugc-data:
    name: flagd-ugc-data
