[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "flagd-phone-agent"
version = "0.1.0"
description = "One-phone visual agent using a self-hosted Mobilerun Portal connection"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "websockets>=15,<18", "pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
flagd-phone = "flagd_phone.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flagd_phone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
