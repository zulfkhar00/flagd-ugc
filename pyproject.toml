[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "flagd-ugc-pipeline"
version = "0.1.0"
description = "Resumable daily AI UGC video generation and Telegram delivery for flagd"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "truststore>=0.10,<1",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
flagd-ugc = "flagd_ugc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flagd_ugc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=.env"
